<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 2 - Colores aleatorios</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <script>
    function setup() {
      createCanvas(400, 400);
      background(128);
      strokeWeight(4);

// Primera letra D
  stroke(random(255), random(255), random(255));
  line(40, 100, 40, 300);
  stroke(random(255), random(255), random(255));
  line(40, 100, 90, 100);
  stroke(random(255), random(255), random(255));
  line(90, 100, 130, 140);
  stroke(random(255), random(255), random(255));
  line(130, 140, 130, 260);
  stroke(random(255), random(255), random(255));
  line(130, 260, 90, 300);
  stroke(random(255), random(255), random(255));
  line(90, 300, 40, 300);

  // Segunda letra D
  stroke(random(255), random(255), random(255));
  line(150, 100, 150, 300);
  stroke(random(255), random(255), random(255));
  line(150, 100, 200, 100);
  stroke(random(255), random(255), random(255));
  line(200, 100, 240, 140);
  stroke(random(255), random(255), random(255));
  line(240, 140, 240, 260);
  stroke(random(255), random(255), random(255));
  line(240, 260, 200, 300);
  stroke(random(255), random(255), random(255));
  line(200, 300, 150, 300);

  // Letra A
  stroke(random(255), random(255), random(255));
  line(260, 300, 300, 100);
  stroke(random(255), random(255), random(255));
  line(300, 100, 340, 300);
  stroke(random(255), random(255), random(255));
  line(275, 220, 325, 220);
}
  </script>
</body>
</html>
