<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 5 - Mi casa</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<script>
function setup() {

  createCanvas(800, 600);

  // CIELO Y SOL
  background(135, 190, 225);

  noStroke();
  fill(255, 205, 70);
  circle(680, 90, 85);

  // MONTAÑAS
  stroke(75, 95, 75);
  strokeWeight(2);
  fill(105, 125, 110);

  triangle(0, 350, 190, 140, 390, 350);
  triangle(300, 350, 530, 115, 750, 350);
  triangle(600, 350, 740, 180, 850, 350);

  // Nieve de las montañas
  noStroke();
  fill(245, 245, 240);
  triangle(145, 190, 190, 140, 235, 190);
  triangle(480, 165, 530, 115, 580, 165);

  // SUELO
  noStroke();
  fill(95, 145, 75);
  rect(0, 350, 800, 250);

  // Camino
  fill(175, 155, 130);
  triangle(320, 600, 480, 600, 430, 400);
  triangle(320, 600, 430, 400, 380, 400);

  // CASA: PAREDES RECTANGULARES

  stroke(85, 65, 45);
  strokeWeight(3);

  // Pared principal
  fill(220, 195, 155);
  rect(220, 260, 360, 260);

  // Tejado
  fill(150, 65, 45);
  triangle(195, 260, 400, 145, 605, 260);

  // Chimenea
  fill(145, 75, 55);
  rect(485, 175, 40, 85);

  // PUERTA
  stroke(80, 55, 35);
  strokeWeight(3);
  fill(115, 75, 45);
  rect(365, 375, 85, 145);

  // Pomo
  noStroke();
  fill(190, 155, 65);
  circle(435, 450, 9);

  // VENTANAS
  stroke(95, 75, 55);
  strokeWeight(4);
  fill(120, 165, 185);

  rect(245, 315, 85, 75);
  rect(470, 315, 85, 75);

  // Marcos interiores
  stroke(240, 235, 220);
  strokeWeight(5);

  line(287, 315, 287, 390);
  line(245, 352, 330, 352);

  line(512, 315, 512, 390);
  line(470, 352, 555, 352);

  // ÁRBOLES

  // Troncos
  stroke(90, 60, 35);
  strokeWeight(2);
  fill(105, 70, 40);
  rect(85, 340, 40, 120);
  rect(660, 340, 40, 120);

  // Copas de los árboles
  noStroke();
  fill(45, 105, 50);
  ellipse(105, 300, 115, 115);
  ellipse(680, 300, 115, 115);

  fill(65, 125, 55);
  circle(75, 280, 65);
  circle(135, 275, 65);
  circle(650, 280, 65);
  circle(710, 275, 65);

  //  FLORES DEL JARDÍN
  fill(210, 75, 65);
  circle(165, 500, 15);
  circle(205, 535, 15);
  circle(615, 510, 15);

  fill(245, 205, 65);
  circle(165, 500, 6);
  circle(205, 535, 6);
  circle(615, 510, 6);

  // NUBES
  noFill();
  stroke(255);
  strokeWeight(4);

  arc(110, 105, 90, 45, PI, TWO_PI);
  arc(150, 105, 90, 45, PI, TWO_PI);

}
</script>

</body>
</html>
