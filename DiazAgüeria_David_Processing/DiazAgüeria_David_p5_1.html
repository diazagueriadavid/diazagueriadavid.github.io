
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 1 - Líneas y colores</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <script>
    function setup() {
      createCanvas(400, 400);
      background(255);

      // Lado superior: rojo, grosor 3.
      stroke(255, 0, 0);
      strokeWeight(3);
      line(50, 80, 300, 80);

      // Lado derecho: verde semitransparente, grosor 5.
      stroke(0, 255, 0, 120);
      strokeWeight(5);
      line(300, 80, 300, 330);

      // Lado inferior: azul, grosor 7.
      stroke(0, 0, 255);
      strokeWeight(7);
      line(300, 330, 50, 330);

      // Lado izquierdo: gris, grosor 4.
      stroke(120);
      strokeWeight(4);
      line(50, 330, 50, 80);
    }
  </script>
</body>
</html>
