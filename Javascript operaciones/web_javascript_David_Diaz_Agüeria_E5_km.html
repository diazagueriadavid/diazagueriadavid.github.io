<DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kilómetros a Metros</title>
</head>
<body>
    <h1>Conversión de Kilómetros a Metros</h1>

    <script>
        let kilometros = parseFloat(prompt("Ingrese la cantidad de kilómetros:"));

        let metros = kilometros * 1000;

        document.write("El resultado es: " + metros + " metros");
    </script>
</body>
</html>
