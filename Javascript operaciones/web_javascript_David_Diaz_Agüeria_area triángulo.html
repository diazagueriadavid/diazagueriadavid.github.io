<DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Área Triángulo</title>
</head>
<body>
    <h1>Cálculo del Área de un Triángulo</h1>

    <script>
        let base = parseFloat(prompt("Ingrese la base:"));
        let altura = parseFloat(prompt("Ingrese la altura:"));

        let area = (base * altura) / 2;

        document.write("El área del triángulo es: " + area);
    </script>
</body>
</html>
