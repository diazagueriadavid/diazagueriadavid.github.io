<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Volumen Prisma</title>
</head>
<body>
    <h1>Cálculo del Volumen de un Prisma Rectangular</h1>

    <script>
        let largo = parseFloat(prompt("Ingrese el largo del prisma:"));
        let ancho = parseFloat(prompt("Ingrese el ancho del prisma:"));
        let altura = parseFloat(prompt("Ingrese la altura del prisma:"));

        let volumen = largo * ancho * altura;

        document.write("El volumen del prisma es: " + volumen);
    </script>
</body>
</html>

</body>
</html>
