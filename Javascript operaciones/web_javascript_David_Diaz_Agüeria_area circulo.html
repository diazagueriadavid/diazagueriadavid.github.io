<DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Área Círculo</title>
</head>
<body>
    <h1>Cálculo del Área de un Círculo</h1>

    <script>
        let radio = parseFloat(prompt("Ingrese el radio:"));

        let area = Math.PI * radio * radio;

        document.write("El área del círculo es: " + area);
    </script>
</body>
</html>
