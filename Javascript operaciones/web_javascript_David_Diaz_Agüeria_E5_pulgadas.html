<DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pulgadas a Centímetros</title>
</head>
<body>
    <h1>Conversión de Pulgadas a Centímetros</h1>

    <script>
        let pulgadas = parseFloat(prompt("Ingrese la cantidad de pulgadas:"));

        let centimetros = pulgadas * 2.54;

        document.write("El resultado es: " + centimetros + " centímetros");
    </script>
</body>
</html>
