<DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hectáreas a m2</title>
</head>
<body>
    <h1>Conversión de Hectáreas a Metros Cuadrados</h1>

    <script>
        let hectareas = parseFloat(prompt("Ingrese la cantidad de hectáreas:"));

        let metros2 = hectareas * 10000;

        document.write("El resultado es: " + metros2 + " metros cuadrados");
    </script>
</body>
</html>
