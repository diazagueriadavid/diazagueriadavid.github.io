<DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Área Cuadrado</title>
</head>
<body>
    <h1>Cálculo del Área de un Cuadrado</h1>

    <script>
        let lado = parseFloat(prompt("Ingrese el valor del lado:"));

        let area = lado * lado;

        document.write("El área del cuadrado es: " + area);
    </script>
</body>
</html>
