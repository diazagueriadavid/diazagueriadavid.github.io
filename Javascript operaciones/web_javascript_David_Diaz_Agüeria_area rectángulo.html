<DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Área Rectángulo</title>
</head>
<body>
    <h1>Cálculo del Área de un Rectángulo</h1>

    <script>
        let base = parseFloat(prompt("Ingrese la base:"));
        let altura = parseFloat(prompt("Ingrese la altura:"));

        let area = base * altura;

        document.write("El área del rectángulo es: " + area);
    </script>
</body>
</html>
