<DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Euros a Dólares</title>
</head>
<body>
    <h1>Conversión de Euros a Dólares</h1>

    <script>
        let euros = parseFloat(prompt("Ingrese la cantidad en Euros:"));

        let dolares = euros * 1.10;

        document.write("El resultado es: " + dolares + " dólares");
    </script>
</body>
</html>
