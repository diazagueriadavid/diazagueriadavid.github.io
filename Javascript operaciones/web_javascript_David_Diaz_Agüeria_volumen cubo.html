<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Volumen Cubo</title>
</head>
<body>
    <h1>Cálculo del Volumen de un Cubo</h1>

    <script>
        let lado = parseFloat(prompt("Ingrese el lado del cubo:"));

        let volumen = Math.pow(lado, 3);

        document.write("El volumen del cubo es: " + volumen);
    </script>
</body>
</html>
