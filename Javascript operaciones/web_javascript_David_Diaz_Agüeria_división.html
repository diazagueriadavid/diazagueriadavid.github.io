<script>
//Definimos variables
let dividendo;
let divisor;
let cociente;

//Pido valores al usuario

dividendo=prompt(" Dame un dividendo cualquiera");
divisor=prompt(" Dame un divisor cualquiera");

//Convierto en Floats
dividendo=parseFloat(dividendo);
divisor=parseFloat(divisor);

//Hago las operaciones que me da la gana
cociente=dividendo/divisor

alert("El resultado de la division es: " + cociente);

document.write("<h1>El resultado de la division es: " + cociente+ "</h1>");


</script>
