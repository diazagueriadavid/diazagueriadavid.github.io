<script>
//Definimos variables
let factor_1;
let factor_2;

//Pido valores al usuario

factor_2=prompt(" Dame un factor cualquiera");

//Convierto en Floats

//Hago las operaciones que me da la gana

document.write("<h1>El resultado de la multiplicación es: " + producto+ "</h1>");


</script>
